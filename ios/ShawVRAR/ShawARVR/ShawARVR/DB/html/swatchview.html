<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - lights - physical lights</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            background-color: #ffffff;
            margin: 0px;
            overflow: hidden;
        }
        a {
            color: #ff0080;
            text-decoration: none;
        }
        a:hover {
            color: #0080ff;
        }
    </style>
</head>
<body>

<div id="container"></div>

<script src="js/three.js"></script>
<script src="js/libs/dat.gui.min.js"></script>
<script src="js/controls/OrbitControls.js"></script>
<script src="js/Detector.js"></script>

<script>
    if ( ! Detector.webgl ) Detector.addGetWebGLMessage();
    var camera, scene, renderer,
        lightDirectional, lightHemi;
    var floorMat, floorMesh;
    // ref for lumens: http://www.power-sure.com/lumens.htm

    var hasTexture = false;

    init();
    animate();
    function init() {
        var container = document.getElementById( 'container' );

        camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
        camera.position.x = -0.3;
        camera.position.z = 0.35;
        camera.position.y = 0.3;

        scene = new THREE.Scene();
        scene.background = new THREE.Color( 0xffffff );

        lightHemi = new THREE.HemisphereLight( 0xaaaaaa, 0x444444, 1.7 )
        scene.add(lightHemi)
        lightDirectional = new THREE.DirectionalLight(0xffffff, 0.3);
        lightDirectional.position.set(0, 5, 0);
        scene.add(lightDirectional)

        floorMat = new THREE.MeshStandardMaterial( {
            roughness: 0.8,
            color: 0xffffff,
            metalness: 0.2,
            bumpScale: 0.0005
        });

        loadTextureAtPath("textures/Base_Color.jpg", "textures/Normal.jpg", "textures/Roughness.jpg", 18, 72);

        var floorGeometry = new THREE.PlaneBufferGeometry( 20, 20 );
        floorMesh = new THREE.Mesh( floorGeometry, floorMat );
        floorMesh.receiveShadow = true;
        floorMesh.rotation.x = -Math.PI / 2.0;
        scene.add( floorMesh );

        renderer = new THREE.WebGLRenderer();
        renderer.physicallyCorrectLights = true;
        renderer.gammaInput = true;
        renderer.gammaOutput = true;
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( window.innerWidth, window.innerHeight );
        container.appendChild( renderer.domElement );
        var controls = new THREE.OrbitControls( camera, renderer.domElement );
        window.addEventListener( 'resize', onWindowResize, false );
    }

    function loadTextureAtPath(diffusePath, normalPath, roughnessPath, width, height) {
        var textureLoader = new THREE.TextureLoader();

        textureLoader.load( diffusePath, function( map ) {
            map.wrapS = THREE.RepeatWrapping;
            map.wrapT = THREE.RepeatWrapping;
            map.anisotropy = 2;
            map.repeat.set( height, width);
            floorMat.map = map;
            floorMat.needsUpdate = true;
            hasTexture = true;
        } );
        textureLoader.load( normalPath, function( map ) {
            map.wrapS = THREE.RepeatWrapping;
            map.wrapT = THREE.RepeatWrapping;
            map.anisotropy = 2;
            map.repeat.set( height, width);
            floorMat.normalMap = map;
            floorMat.needsUpdate = true;
        } );
        textureLoader.load( roughnessPath, function( map ) {
            map.wrapS = THREE.RepeatWrapping;
            map.wrapT = THREE.RepeatWrapping;
            map.anisotropy = 2;
            map.repeat.set( height, width);
            floorMat.roughnessMap = map;
            floorMat.needsUpdate = true;
        } );
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize( window.innerWidth, window.innerHeight );
    }

    //
    function animate() {
        requestAnimationFrame( animate );
        render();
    }

    var previousTime;
    function render() {

        if (hasTexture) renderer.render( scene, camera );

        if (previousTime) {
            floorMesh.rotation.z += 0.003;
        }

        previousTime = Date.now();
    }
</script>
</body>
</html>
